const KEY='arraia-demo-github-1';let view='inicio',itemPage=0,boothPage=0;let page='cliente',stall=1,cart={},cameraStream=null,cameraTimer=null,alarmTimer=null,alarmMuted=localStorage.getItem('arraia-muted')==='1';const seed=()=>({stalls:[{id:1,name:'Barraca do Pastel',open:true,avg:6},{id:2,name:'Bebidas',open:true,avg:3},{id:3,name:'Doces da Roça',open:true,avg:4}],products:[{id:1,stall:1,name:'Pastel de queijo',price:9,stock:30,active:true},{id:2,stall:1,name:'Pastel de carne',price:10,stock:25,active:true},{id:3,stall:2,name:'Refrigerante',price:6,stock:40,active:true},{id:4,stall:2,name:'Quentão sem álcool',price:7,stock:20,active:true},{id:5,stall:3,name:'Bolo de milho',price:7,stock:20,active:true},{id:6,stall:3,name:'Pé de moleque',price:5,stock:30,active:true}],tickets:[],orders:[],next:1001});let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed()}const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()},p=id=>db.products.find(x=>x.id==id),s=id=>db.stalls.find(x=>x.id==id),money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,10).toUpperCase(),qr=txt=>'<img class="qr" alt="Código QR" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(txt)+'">',status={pendente:'Na fila',preparando:'Preparando',pronto:'Pronto para retirar',chegou:'Cliente na barraca',entregue:'Entregue'};function tab(t){stopScan();page=t;view='inicio';itemPage=0;boothPage=0;render()}function render(){document.getElementById('nav').innerHTML=[['cliente','🎟️ Carteira'],['caixa','💳 Caixa'],['banca','🍳 Barraca'],['gestao','⚙️ Gestão']].map(([k,n])=>'<button class="'+(page===k?'on':'')+'" onclick="tab(\''+k+'\')">'+n+'</button>').join('');document.getElementById('app').innerHTML=({cliente:client,caixa:cash,banca:booth,gestao:admin}[page])();fitScreen();}function cash(){let total=Object.entries(cart).reduce((a,[id,q])=>a+p(+id).price*q,0);return '<h2>Caixa • Venda de fichas</h2><p class="muted">Selecione produtos de barracas diferentes e gere uma única ficha de compra.</p>'+db.stalls.map(b=>'<section class="card"><h3>'+esc(b.name)+'</h3>'+db.products.filter(x=>x.stall===b.id&&x.active&&b.open).map(x=>'<div class="line"><span>'+esc(x.name)+' <span class="muted">'+money(x.price)+' · estoque '+x.stock+'</span></span><input aria-label="Quantidade de '+esc(x.name)+'" type="number" min="0" max="'+x.stock+'" value="'+(cart[x.id]||0)+'" onchange="cart['+x.id+']=Math.max(0,Math.min('+x.stock+',+this.value||0));render()"></div>').join('')+'</section>').join('')+'<section class="card"><div class="line"><strong>Total: '+money(total)+'</strong><button class="primary" onclick="sell()" '+(!total?'disabled':'')+'>Emitir ficha única</button></div></section>'+ (db.tickets.length?'<section class="card"><h3>Última ficha emitida</h3><strong>'+db.tickets.at(-1).code+'</strong>'+qr(db.tickets.at(-1).code)+'<p class="muted">Informe esse código na carteira do cliente.</p></section>':'')}function sell(){let items=Object.entries(cart).filter(([id,q])=>q>0&&p(+id).active&&s(p(+id).stall).open&&p(+id).stock>=q).map(([id,q])=>({product:+id,qty:+q,used:0}));if(!items.length)return alert('Selecione produtos disponíveis.');let code='ARRAIA-'+db.next+++'-'+uid().slice(0,4);db.tickets.push({code,items,claimed:false,at:Date.now()});cart={};save();alert('Ficha emitida: '+code)}function client(){let wallet=db.tickets.filter(t=>t.claimed),mine=db.orders,ready=mine.filter(o=>o.status==='pronto'),waiting=mine.filter(o=>o.status==='pendente'||o.status==='preparando'),credits=wallet.reduce((a,t)=>a+t.items.reduce((v,i)=>v+i.qty-i.used,0),0),tabs=[['inicio','🏠','Início'],['ler','📷','Ler QR'],['creditos','🎟️','Créditos'],['pedidos','🍳','Pedidos']];let menu='<div class="screenActions">'+tabs.map(([id,emoji,label])=>'<button class="'+(view===id?'on':'')+'" onclick="setView(\''+id+'\')"><span class="emoji">'+emoji+'</span>'+label+'</button>').join('')+'</div>';let body='';if(view==='inicio'){body='<div class="hero"><h2>🎪 Sua festa na palma da mão</h2><p>Escolha o que deseja acompanhar.</p><div class="bigstatus"><div><b>'+credits+'</b><span>Créditos</span></div><div><b>'+waiting.length+'</b><span>Em preparo</span></div><div><b>'+ready.length+'</b><span>Prontos</span></div></div></div>'+(ready.length?'<div class="notice ready alert"><h2>🔔 '+ready.length+' pedido(s) pronto(s)!</h2><button class="action" onclick="setView(\'pedidos\')">Ver retirada</button> <button onclick="toggleMute()">'+(alarmMuted?'🔇 Sem som':'🔊 Silenciar')+'</button></div>':'')+'<div class="tiles"><button class="tile" onclick="setView(\'ler\')"><span class="emoji">📷</span><strong>Ler ficha</strong><small>QR do caixa</small></button><button class="tile" onclick="setView(\'creditos\')"><span class="emoji">🎟️</span><strong>Créditos</strong><small>Ativar produtos</small></button><button class="tile" onclick="setView(\'pedidos\')"><span class="emoji">🍳</span><strong>Minha fila</strong><small>Status e previsão</small></button><button class="tile" onclick="setView(\'pedidos\')"><span class="emoji">🛎️</span><strong>Retirada</strong><small>Mostrar QR</small></button></div>'}else if(view==='ler'){body='<div class="card"><h2>📷 Ler QR do caixa</h2><p class="muted">Aponte a câmera para a ficha única de compra.</p><div class="scanbox"><div style="font-size:48px">📸</div><button class="action primary" onclick="startScan(\'claim\')">Abrir câmera</button><div id="cameraArea"></div></div><div class="row" style="margin-top:12px"><input id="claimcode" placeholder="Ou digite o código"><button onclick="claim()">Resgatar</button></div></div>'}else if(view==='creditos'){let list=wallet.flatMap(t=>t.items.map(i=>({t,i}))).filter(z=>z.i.qty>z.i.used),pg=pageItems(list,itemPage,2);body='<h2>🎟️ Seus créditos disponíveis</h2><div class="compactList">'+(pg.items.length?pg.items.map(({t,i})=>{let x=p(i.product),n=i.qty-i.used;return '<div class="card"><h3>'+esc(x.name)+'</h3><p class="muted">'+esc(s(x.stall).name)+' · '+n+' crédito(s)</p><button class="action primary" onclick="activate(\''+t.code+'\','+x.id+')" '+(!n||!x.active||!s(x.stall).open||x.stock<1?'disabled':'')+'>🍳 Colocar 1 na fila</button></div>'}).join(''):'<div class="card">Nenhum crédito disponível. Leia uma ficha do caixa.</div>')+'</div>'+pager(pg.current,pg.pages,'itemPage')}else{let pg=pageItems(mine.slice().reverse(),itemPage,1);body='<h2>🍳 Meus pedidos</h2><div class="compactList">'+(pg.items.length?pg.items.map(o=>{let x=p(o.product),b=s(x.stall),ahead=db.orders.filter(z=>z.stall===o.stall&&z.status!=='entregue'&&z.created<o.created).length,step=o.status==='pendente'?0:o.status==='preparando'?1:2;return '<div class="card '+(o.status==='pronto'?'alert':'')+'"><div class="line"><strong>'+esc(x.name)+'</strong><span class="pill">'+status[o.status]+'</span></div><p class="muted">'+esc(b.name)+' · '+o.code+'</p><div class="bigstatus"><div><b>'+(step===0?'🧾':step===1?'🍳':'🎉')+'</b><span>Status</span></div><div><b>'+(step<2?ahead+1:'✓')+'</b><span>Posição</span></div><div><b>'+(step<2?(ahead+1)*b.avg+'m':'✓')+'</b><span>Estimativa</span></div></div><div class="progress"><span class="done"></span><span class="'+(step>=1?'done':'')+'"></span><span class="'+(step>=2?'done':'')+'"></span></div>'+(o.status==='pronto'||o.status==='chegou'?'<div class="notice ready"><strong>📱 Mostre o QR na barraca</strong>'+qr('RETIRADA:'+o.code)+'</div>':'')+(o.status==='chegou'?'<button class="action primary" onclick="deliver(\''+o.code+'\')">✅ Confirmar recebimento</button>':'')+(o.status==='pronto'?'<button onclick="toggleMute()">'+(alarmMuted?'🔇 Ativar som':'🔊 Silenciar aviso')+'</button>':'')+'</div>'}).join(''):'<div class="card">Nenhum pedido ativado.</div>')+'</div>'+pager(pg.current,pg.pages,'itemPage')}return '<div class="screenPage">'+menu+'<div class="screenPane"><div>'+body+'</div></div></div>'}
function claim(){let code=document.getElementById('claimcode').value.trim().toUpperCase(),t=db.tickets.find(x=>x.code===code);if(!t)return alert('Ficha não encontrada.');if(t.claimed)return alert('Ficha já resgatada.');t.claimed=true;save()}function activate(code,id){let t=db.tickets.find(x=>x.code===code),i=t?.items.find(x=>x.product===id),x=p(id);if(!t?.claimed||!i||i.used>=i.qty||!x.active||!s(x.stall).open||x.stock<1)return alert('Crédito ou produto indisponível.');i.used++;x.stock--;db.orders.push({code:'PED-'+uid(),product:id,stall:x.stall,status:'pendente',created:Date.now()});save()}function booth(){let orders=db.orders.filter(o=>o.stall===stall&&o.status!=='entregue'),pg=pageItems(orders,boothPage,1);let menu='<div class="screenActions">'+db.stalls.map(x=>'<button class="'+(stall===x.id?'on':'')+'" onclick="stall='+x.id+';boothPage=0;render()"><span class="emoji">'+(x.id===1?'🥟':x.id===2?'🥤':'🍰')+'</span>'+esc(x.name)+'</button>').join('')+'</div>';let body='<div class="bigstatus"><div><b>'+orders.filter(o=>o.status==='pendente').length+'</b><span>Na fila</span></div><div><b>'+orders.filter(o=>o.status==='preparando').length+'</b><span>Preparando</span></div><div><b>'+orders.filter(o=>o.status==='pronto').length+'</b><span>Prontos</span></div></div><div class="card"><div class="line"><strong>📷 QR de retirada</strong><button onclick="startScan(\'pickup\')">Ler câmera</button></div><div id="cameraArea"></div><div class="row"><input id="pickup" placeholder="Código PED-..."><button onclick="arrived()">Confirmar</button></div></div><div class="compactList">'+(pg.items.length?pg.items.map(o=>'<div class="card"><h2>'+esc(p(o.product).name)+'</h2><p>'+status[o.status]+' · '+o.code+'</p>'+(o.status==='pendente'?'<button class="action" onclick="advance(\''+o.code+'\',\'preparando\')">🍳 Iniciar preparo</button>':o.status==='preparando'?'<button class="action primary" onclick="advance(\''+o.code+'\',\'pronto\')">🔔 Marcar pronto</button>':'<span class="pill">Aguardando cliente</span>')+'</div>').join(''):'<div class="card">Sem pedidos na fila.</div>')+'</div>'+pager(pg.current,pg.pages,'boothPage');return '<div class="screenPage">'+menu+'<div class="screenPane"><div>'+body+'</div></div></div>'}
function advance(code,state){let o=db.orders.find(x=>x.code===code);if(o)o.status=state;save()}function arrived(){let code=document.getElementById('pickup').value.trim().replace(/^RETIRADA:/i,'').toUpperCase(),o=db.orders.find(x=>x.code===code&&x.stall===stall);if(!o||o.status!=='pronto')return alert('Pedido não encontrado ou ainda não pronto.');o.status='chegou';save()}function deliver(code){let o=db.orders.find(x=>x.code===code);if(o?.status==='chegou')o.status='entregue';save()}function admin(){return '<h2>Gestão do evento</h2><section class="card"><div class="line"><span>Fichas emitidas: <b>'+db.tickets.length+'</b></span><span>Pedidos: <b>'+db.orders.length+'</b></span></div><p>Vendas registradas: <b>'+money(db.tickets.reduce((a,t)=>a+t.items.reduce((v,i)=>v+p(i.product).price*i.qty,0),0))+'</b></p></section>'+db.stalls.map(b=>'<section class="card"><div class="line"><h3>'+esc(b.name)+'</h3><button class="'+(b.open?'warn':'primary')+'" onclick="toggleStall('+b.id+')">'+(b.open?'Fechar':'Abrir')+'</button></div><label>Tempo médio (min) <input type="number" min="1" value="'+b.avg+'" onchange="setAvg('+b.id+',this.value)"></label>'+db.products.filter(x=>x.stall===b.id).map(x=>'<div class="line"><span>'+esc(x.name)+' <span class="tag">'+money(x.price)+'</span></span><div class="row"><input aria-label="Estoque" type="number" min="0" value="'+x.stock+'" onchange="setStock('+x.id+',this.value)"><button onclick="toggleProduct('+x.id+')">'+(x.active?'Desativar':'Ativar')+'</button></div></div>').join('')+'</section>').join('')+'<section class="card"><h3>Nova barraca</h3><div class="row"><input id="newstall" placeholder="Nome da barraca"><button onclick="addStall()">Adicionar</button></div><h3>Novo produto</h3><div class="row"><select id="ps">'+db.stalls.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select><input id="pn" placeholder="Produto"><input id="pp" type="number" min="0" step=".01" placeholder="Preço"><input id="pq" type="number" min="0" placeholder="Estoque"><button onclick="addProduct()">Adicionar</button></div></section><section class="card"><button class="warn" onclick="if(confirm(\'Apagar os dados da demonstração?\')){db=seed();cart={};save()}">Reiniciar demonstração</button></section>'}function toggleStall(id){s(id).open=!s(id).open;save()}function toggleProduct(id){p(id).active=!p(id).active;save()}function setStock(id,v){p(id).stock=Math.max(0,+v||0);save()}function setAvg(id,v){s(id).avg=Math.max(1,+v||1);save()}function addStall(){let name=document.getElementById('newstall').value.trim();if(!name)return;db.stalls.push({id:Math.max(0,...db.stalls.map(x=>x.id))+1,name,open:true,avg:5});save()}function addProduct(){let name=document.getElementById('pn').value.trim(),price=+document.getElementById('pp').value,stock=+document.getElementById('pq').value;if(!name||price<0||!Number.isFinite(price))return alert('Preencha o produto e preço.');db.products.push({id:Math.max(0,...db.products.map(x=>x.id))+1,stall:+document.getElementById('ps').value,name,price,stock:Math.max(0,stock||0),active:true});save()}
// Leitura de QR: câmera em navegadores compatíveis; fallback manual.
async function stopScan(){if(cameraTimer){clearInterval(cameraTimer);cameraTimer=null}if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}let a=document.getElementById('cameraArea');if(a)a.innerHTML=''}
async function startScan(mode){await stopScan();let area=document.getElementById('cameraArea');if(!area)return;if(!navigator.mediaDevices?.getUserMedia){area.innerHTML='<p>Este navegador não liberou a câmera. Digite o código manualmente.</p>';return}if(!('BarcodeDetector' in window)){area.innerHTML='<p>Seu navegador não oferece leitura automática de QR. Use o Chrome atualizado ou digite o código.</p>';return}try{let detector=new BarcodeDetector({formats:['qr_code']});cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});area.innerHTML='<video id="cameraVideo" autoplay playsinline muted></video><p class="muted">Posicione o QR dentro da imagem.</p><button onclick="stopScan()">Fechar câmera</button>';let video=document.getElementById('cameraVideo');video.srcObject=cameraStream;await video.play();let busy=false;cameraTimer=setInterval(async()=>{if(busy||!cameraStream)return;busy=true;try{let codes=await detector.detect(video);if(codes.length){let value=codes[0].rawValue.trim();await stopScan();if(mode==='claim'){let el=document.getElementById('claimcode');if(el){el.value=value;claim()}}else{let el=document.getElementById('pickup');if(el){el.value=value;arrived()}}}}catch(e){}finally{busy=false}},350)}catch(e){await stopScan();let a=document.getElementById('cameraArea');if(a)a.innerHTML='<p>Não foi possível acessar a câmera. Verifique a permissão no Chrome ou digite o código.</p>'}}
function toggleMute(){alarmMuted=!alarmMuted;localStorage.setItem('arraia-muted',alarmMuted?'1':'0');if(!alarmMuted)beep();render()}
let audioContext=null;function beep(){if(alarmMuted||document.hidden||!db.orders.some(o=>o.status==='pronto'))return;try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();let o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.setValueAtTime(740,audioContext.currentTime);o.frequency.setValueAtTime(940,audioContext.currentTime+.16);g.gain.setValueAtTime(.0001,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.09,audioContext.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+.43);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.45)}catch(e){}}
setInterval(()=>{if(page==='cliente')beep()},5000);

function setView(v){stopScan();view=v;itemPage=0;render()}
function pageItems(list,index,size=2){let pages=Math.max(1,Math.ceil(list.length/size)),current=Math.max(0,Math.min(index,pages-1));return {items:list.slice(current*size,(current+1)*size),current,pages}}
function pager(current,pages,which){return pages>1?'<div class="pager"><button onclick="'+which+'=Math.max(0,'+which+'-1);render()">◀ Anterior</button><span>'+(current+1)+' / '+pages+'</span><button onclick="'+which+'=Math.min('+(pages-1)+','+which+'+1);render()">Próximo ▶</button></div>':''}
function fitScreen(){const root=document.getElementById('app');if(!root)return;const pane=root.querySelector('.screenPane');if(!pane)return;let content=pane.firstElementChild;if(!content)return;let factor=1;content.style.zoom='1';while(content.scrollHeight>pane.clientHeight&&factor>.66){factor-=.04;content.style.zoom=String(factor)}}
render();
