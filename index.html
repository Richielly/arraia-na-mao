<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8c3d28"><title>Arraiá na Mão</title><style>
:root{font-family:system-ui,Arial;color:#35251d;background:#fff7e8}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#7d2c22,#d26b2b);color:white;padding:22px 18px}header h1{margin:0;font-size:28px}header p{margin:5px 0 0}main{max-width:960px;margin:auto;padding:15px}nav{display:flex;gap:7px;overflow:auto;padding:12px 0}button,select,input{font:inherit;border-radius:11px;padding:10px;border:1px solid #ddc9ad}button{background:#8c3d28;color:white;cursor:pointer;border:0}button:disabled{opacity:.45}nav button{white-space:nowrap;background:#fff;color:#723b2c;border:1px solid #ead7bd}nav button.on{background:#8c3d28;color:#fff}.card{background:white;border:1px solid #f0dfc6;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 14px #8b512012}h2{margin:6px 0 12px}h3{margin:10px 0}.muted{color:#856f61;font-size:13px}.line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 0;flex-wrap:wrap}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tag{background:#fff1da;border-radius:9px;padding:5px 9px;font-size:12px}input{max-width:100%;background:#fff}input[type=number]{width:80px}.primary{background:#26785d}.warn{background:#ad5d2b}.alert{border:2px solid #e3a031;animation:glow 1.8s infinite alternate}@keyframes glow{to{box-shadow:0 0 24px #efb32c88}}.qr{display:block;margin:12px auto;width:180px;height:180px}.pill{padding:5px 9px;background:#e9f5ee;border-radius:8px}footer{text-align:center;color:#937967;font-size:12px;padding:24px}</style></head><body><header><h1>🎪 Arraiá na Mão</h1><p>Seu pedido, no seu tempo • Demonstração</p></header><main><nav id="nav"></nav><div id="app"></div></main><footer>Protótipo local • Dados armazenados neste navegador • Sem pagamentos reais ou sincronização entre aparelhos</footer><script>
const KEY='arraia-demo-github-1';let page='cliente',stall=1,cart={};const seed=()=>({stalls:[{id:1,name:'Barraca do Pastel',open:true,avg:6},{id:2,name:'Bebidas',open:true,avg:3},{id:3,name:'Doces da Roça',open:true,avg:4}],products:[{id:1,stall:1,name:'Pastel de queijo',price:9,stock:30,active:true},{id:2,stall:1,name:'Pastel de carne',price:10,stock:25,active:true},{id:3,stall:2,name:'Refrigerante',price:6,stock:40,active:true},{id:4,stall:2,name:'Quentão sem álcool',price:7,stock:20,active:true},{id:5,stall:3,name:'Bolo de milho',price:7,stock:20,active:true},{id:6,stall:3,name:'Pé de moleque',price:5,stock:30,active:true}],tickets:[],orders:[],next:1001});let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed()}const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()},p=id=>db.products.find(x=>x.id==id),s=id=>db.stalls.find(x=>x.id==id),money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,10).toUpperCase(),qr=txt=>'<img class="qr" alt="Código QR" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(txt)+'">',status={pendente:'Na fila',preparando:'Preparando',pronto:'Pronto para retirar',chegou:'Cliente na barraca',entregue:'Entregue'};function tab(t){page=t;render()}function render(){document.getElementById('nav').innerHTML=[['cliente','🎟️ Carteira'],['caixa','💳 Caixa'],['banca','🍳 Barraca'],['gestao','⚙️ Gestão']].map(([k,n])=>'<button class="'+(page===k?'on':'')+'" onclick="tab(\''+k+'\')">'+n+'</button>').join('');document.getElementById('app').innerHTML=({cliente:client,caixa:cash,banca:booth,gestao:admin}[page])();}function cash(){let total=Object.entries(cart).reduce((a,[id,q])=>a+p(+id).price*q,0);return '<h2>Caixa • Venda de fichas</h2><p class="muted">Selecione produtos de barracas diferentes e gere uma única ficha de compra.</p>'+db.stalls.map(b=>'<section class="card"><h3>'+esc(b.name)+'</h3>'+db.products.filter(x=>x.stall===b.id&&x.active&&b.open).map(x=>'<div class="line"><span>'+esc(x.name)+' <span class="muted">'+money(x.price)+' · estoque '+x.stock+'</span></span><input aria-label="Quantidade de '+esc(x.name)+'" type="number" min="0" max="'+x.stock+'" value="'+(cart[x.id]||0)+'" onchange="cart['+x.id+']=Math.max(0,Math.min('+x.stock+',+this.value||0));render()"></div>').join('')+'</section>').join('')+'<section class="card"><div class="line"><strong>Total: '+money(total)+'</strong><button class="primary" onclick="sell()" '+(!total?'disabled':'')+'>Emitir ficha única</button></div></section>'+ (db.tickets.length?'<section class="card"><h3>Última ficha emitida</h3><strong>'+db.tickets.at(-1).code+'</strong>'+qr(db.tickets.at(-1).code)+'<p class="muted">Informe esse código na carteira do cliente.</p></section>':'')}function sell(){let items=Object.entries(cart).filter(([id,q])=>q>0&&p(+id).active&&s(p(+id).stall).open&&p(+id).stock>=q).map(([id,q])=>({product:+id,qty:+q,used:0}));if(!items.length)return alert('Selecione produtos disponíveis.');let code='ARRAIA-'+db.next+++'-'+uid().slice(0,4);db.tickets.push({code,items,claimed:false,at:Date.now()});cart={};save();alert('Ficha emitida: '+code)}function client(){let wallet=db.tickets.filter(t=>t.claimed),active=db.orders.filter(o=>o.status!=='entregue');return '<h2>Minha carteira</h2><section class="card"><h3>Resgatar ficha de compra</h3><div class="row"><input id="claimcode" placeholder="ARRAIA-1001-XXXX"><button onclick="claim()">Adicionar créditos</button></div><p class="muted">Uma ficha reúne produtos de várias barracas. Ative cada unidade quando quiser entrar na fila.</p></section>'+wallet.map(t=>'<section class="card"><h3>🎟️ '+esc(t.code)+'</h3>'+t.items.map(i=>{let x=p(i.product),remaining=i.qty-i.used;return '<div class="line"><span>'+esc(x.name)+' <span class="tag">'+remaining+' disponível(is)</span></span><button onclick="activate(\''+t.code+'\','+x.id+')" '+(!remaining||!x.active||!s(x.stall).open||x.stock<1?'disabled':'')+'>Ativar 1</button></div>'}).join('')+'</section>').join('')+(wallet.length?'':'<p class="muted">Você ainda não resgatou fichas. Use a aba Caixa para simular uma compra.</p>')+'<h2>Meus pedidos</h2>'+db.orders.map(o=>{let x=p(o.product),b=s(x.stall),ahead=db.orders.filter(z=>z.stall===o.stall&&z.status!=='entregue'&&z.created<o.created).length;return '<section class="card '+(o.status==='pronto'?'alert':'')+'"><div class="line"><strong>'+esc(x.name)+'</strong><span class="pill">'+status[o.status]+'</span></div><div class="muted">'+esc(b.name)+' · '+o.code+'</div>'+(o.status==='pendente'||o.status==='preparando'?'<p>Posição aproximada: '+(ahead+1)+' · Previsão estimada: '+((ahead+1)*b.avg)+' min</p>':'')+(o.status==='pronto'||o.status==='chegou'?qr('RETIRADA:'+o.code):'')+(o.status==='chegou'?'<button class="primary" onclick="deliver(\''+o.code+'\')">Confirmar recebimento</button>':'')+'</section>'}).join('')}function claim(){let code=document.getElementById('claimcode').value.trim().toUpperCase(),t=db.tickets.find(x=>x.code===code);if(!t)return alert('Ficha não encontrada.');if(t.claimed)return alert('Ficha já resgatada.');t.claimed=true;save()}function activate(code,id){let t=db.tickets.find(x=>x.code===code),i=t?.items.find(x=>x.product===id),x=p(id);if(!t?.claimed||!i||i.used>=i.qty||!x.active||!s(x.stall).open||x.stock<1)return alert('Crédito ou produto indisponível.');i.used++;x.stock--;db.orders.push({code:'PED-'+uid(),product:id,stall:x.stall,status:'pendente',created:Date.now()});save()}function booth(){let b=s(stall),orders=db.orders.filter(o=>o.stall===stall&&o.status!=='entregue');return '<h2>Painel da barraca</h2><section class="card"><select onchange="stall=+this.value;render()">'+db.stalls.map(x=>'<option value="'+x.id+'" '+(stall===x.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select><p class="muted">'+orders.length+' pedidos em andamento</p></section><section class="card"><h3>Confirmar chegada para retirada</h3><div class="row"><input id="pickup" placeholder="PED-XXXXXXXX ou RETIRADA:PED-..."><button onclick="arrived()">Confirmar QR/código</button></div><p class="muted">Nesta demonstração, digite o código exibido na carteira.</p></section>'+orders.map(o=>'<section class="card"><div class="line"><strong>'+esc(p(o.product).name)+'</strong><span class="tag">'+status[o.status]+'</span></div><p class="muted">'+o.code+'</p>'+(o.status==='pendente'?'<button onclick="advance(\''+o.code+'\',\'preparando\')">Iniciar preparo</button>':o.status==='preparando'?'<button class="primary" onclick="advance(\''+o.code+'\',\'pronto\')">Marcar pronto</button>':'')+'</section>').join('')}function advance(code,state){let o=db.orders.find(x=>x.code===code);if(o)o.status=state;save()}function arrived(){let code=document.getElementById('pickup').value.trim().replace(/^RETIRADA:/i,'').toUpperCase(),o=db.orders.find(x=>x.code===code&&x.stall===stall);if(!o||o.status!=='pronto')return alert('Pedido não encontrado ou ainda não pronto.');o.status='chegou';save()}function deliver(code){let o=db.orders.find(x=>x.code===code);if(o?.status==='chegou')o.status='entregue';save()}function admin(){return '<h2>Gestão do evento</h2><section class="card"><div class="line"><span>Fichas emitidas: <b>'+db.tickets.length+'</b></span><span>Pedidos: <b>'+db.orders.length+'</b></span></div><p>Vendas registradas: <b>'+money(db.tickets.reduce((a,t)=>a+t.items.reduce((v,i)=>v+p(i.product).price*i.qty,0),0))+'</b></p></section>'+db.stalls.map(b=>'<section class="card"><div class="line"><h3>'+esc(b.name)+'</h3><button class="'+(b.open?'warn':'primary')+'" onclick="toggleStall('+b.id+')">'+(b.open?'Fechar':'Abrir')+'</button></div><label>Tempo médio (min) <input type="number" min="1" value="'+b.avg+'" onchange="setAvg('+b.id+',this.value)"></label>'+db.products.filter(x=>x.stall===b.id).map(x=>'<div class="line"><span>'+esc(x.name)+' <span class="tag">'+money(x.price)+'</span></span><div class="row"><input aria-label="Estoque" type="number" min="0" value="'+x.stock+'" onchange="setStock('+x.id+',this.value)"><button onclick="toggleProduct('+x.id+')">'+(x.active?'Desativar':'Ativar')+'</button></div></div>').join('')+'</section>').join('')+'<section class="card"><h3>Nova barraca</h3><div class="row"><input id="newstall" placeholder="Nome da barraca"><button onclick="addStall()">Adicionar</button></div><h3>Novo produto</h3><div class="row"><select id="ps">'+db.stalls.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select><input id="pn" placeholder="Produto"><input id="pp" type="number" min="0" step=".01" placeholder="Preço"><input id="pq" type="number" min="0" placeholder="Estoque"><button onclick="addProduct()">Adicionar</button></div></section><section class="card"><button class="warn" onclick="if(confirm(\'Apagar os dados da demonstração?\')){db=seed();cart={};save()}">Reiniciar demonstração</button></section>'}function toggleStall(id){s(id).open=!s(id).open;save()}function toggleProduct(id){p(id).active=!p(id).active;save()}function setStock(id,v){p(id).stock=Math.max(0,+v||0);save()}function setAvg(id,v){s(id).avg=Math.max(1,+v||1);save()}function addStall(){let name=document.getElementById('newstall').value.trim();if(!name)return;db.stalls.push({id:Math.max(0,...db.stalls.map(x=>x.id))+1,name,open:true,avg:5});save()}function addProduct(){let name=document.getElementById('pn').value.trim(),price=+document.getElementById('pp').value,stock=+document.getElementById('pq').value;if(!name||price<0||!Number.isFinite(price))return alert('Preencha o produto e preço.');db.products.push({id:Math.max(0,...db.products.map(x=>x.id))+1,stall:+document.getElementById('ps').value,name,price,stock:Math.max(0,stock||0),active:true});save()}render();
</script></body></html>
