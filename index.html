<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8c3d28"><title>Arraiá na Mão</title><style>
:root{font-family:system-ui,Arial;color:#35251d;background:#fff7e8}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#7d2c22,#d26b2b);color:white;padding:22px 18px}header h1{margin:0;font-size:28px}header p{margin:5px 0 0}main{max-width:960px;margin:auto;padding:15px}nav{display:flex;gap:7px;overflow:auto;padding:12px 0}button,select,input{font:inherit;border-radius:11px;padding:10px;border:1px solid #ddc9ad}button{background:#8c3d28;color:white;cursor:pointer;border:0}button:disabled{opacity:.45}nav button{white-space:nowrap;background:#fff;color:#723b2c;border:1px solid #ead7bd}nav button.on{background:#8c3d28;color:#fff}.card{background:white;border:1px solid #f0dfc6;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 14px #8b512012}h2{margin:6px 0 12px}h3{margin:10px 0}.muted{color:#856f61;font-size:13px}.line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 0;flex-wrap:wrap}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tag{background:#fff1da;border-radius:9px;padding:5px 9px;font-size:12px}input{max-width:100%;background:#fff}input[type=number]{width:80px}.primary{background:#26785d}.warn{background:#ad5d2b}.alert{border:2px solid #e3a031;animation:glow 1.8s infinite alternate}@keyframes glow{to{box-shadow:0 0 24px #efb32c88}}.qr{display:block;margin:12px auto;width:180px;height:180px}.pill{padding:5px 9px;background:#e9f5ee;border-radius:8px}footer{text-align:center;color:#937967;font-size:12px;padding:24px}
/* Mobile-first: informações grandes, visíveis e sem menus suspensos */
body{background:#fff9ef}main{padding:12px;max-width:720px}header{padding:18px 16px}header h1{font-size:27px}
nav{position:sticky;top:0;z-index:10;background:#fff9ef;padding:10px 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;overflow:visible}
nav button{white-space:normal;min-height:65px;padding:7px 3px;font-size:12px;font-weight:800;border-radius:14px}
.card{padding:17px;border-radius:20px}.hero{background:linear-gradient(125deg,#8c3d28,#c76a30);color:white;border-radius:22px;padding:21px;margin:12px 0}.hero h2{font-size:24px;margin:0}.hero .muted{color:#ffead5}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:12px 0}
.tile{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:136px;background:white;border:2px solid #f0ddc3;border-radius:21px;padding:13px;gap:7px;color:#4b2d20}
.tile .emoji{font-size:43px;line-height:1.1}.tile strong{font-size:19px}.tile small{font-size:13px;color:#856f61}
.tile.selected{background:#fff0d8;border-color:#b7652e}.tile.ready{background:#f5fbea;border-color:#5eac61}
.bigstatus{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
.bigstatus>div{background:#f7eddf;border-radius:14px;padding:10px 5px;text-align:center}.bigstatus b{display:block;font-size:24px}.bigstatus span{font-size:11px}
.action{font-size:16px;font-weight:800;padding:15px 18px;min-height:54px}
.notice{padding:16px;border-radius:18px;background:#fff0cf;border:2px solid #e7ad42;margin:12px 0}
.notice.ready{background:#f1ffe6;border-color:#54a75c}
.progress{display:flex;gap:4px;margin:15px 0}.progress span{height:9px;border-radius:10px;flex:1;background:#e8d7c5}.progress span.done{background:#388866}
.scanbox{background:#fff3dd;border:2px dashed #d6a258;border-radius:18px;padding:16px;text-align:center}
#cameraVideo{width:100%;max-height:320px;object-fit:cover;border-radius:14px;background:#181818;margin-top:12px}
input{min-height:44px}input#claimcode{flex:1;min-width:160px}
@media(max-width:380px){.tile{min-height:124px}.tile .emoji{font-size:36px}.tile strong{font-size:16px}}
</style></head><body><header><h1>🎪 Arraiá na Mão</h1><p>Seu pedido, no seu tempo • Demonstração</p></header><main><nav id="nav"></nav><div id="app"></div></main><footer>Protótipo local • Dados armazenados neste navegador • Sem pagamentos reais ou sincronização entre aparelhos</footer><script>
const KEY='arraia-demo-github-1';let page='cliente',stall=1,cart={},cameraStream=null,cameraTimer=null,alarmTimer=null,alarmMuted=localStorage.getItem('arraia-muted')==='1';const seed=()=>({stalls:[{id:1,name:'Barraca do Pastel',open:true,avg:6},{id:2,name:'Bebidas',open:true,avg:3},{id:3,name:'Doces da Roça',open:true,avg:4}],products:[{id:1,stall:1,name:'Pastel de queijo',price:9,stock:30,active:true},{id:2,stall:1,name:'Pastel de carne',price:10,stock:25,active:true},{id:3,stall:2,name:'Refrigerante',price:6,stock:40,active:true},{id:4,stall:2,name:'Quentão sem álcool',price:7,stock:20,active:true},{id:5,stall:3,name:'Bolo de milho',price:7,stock:20,active:true},{id:6,stall:3,name:'Pé de moleque',price:5,stock:30,active:true}],tickets:[],orders:[],next:1001});let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed()}const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()},p=id=>db.products.find(x=>x.id==id),s=id=>db.stalls.find(x=>x.id==id),money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,10).toUpperCase(),qr=txt=>'<img class="qr" alt="Código QR" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(txt)+'">',status={pendente:'Na fila',preparando:'Preparando',pronto:'Pronto para retirar',chegou:'Cliente na barraca',entregue:'Entregue'};function tab(t){stopScan();page=t;render()}function render(){document.getElementById('nav').innerHTML=[['cliente','🎟️ Carteira'],['caixa','💳 Caixa'],['banca','🍳 Barraca'],['gestao','⚙️ Gestão']].map(([k,n])=>'<button class="'+(page===k?'on':'')+'" onclick="tab(\''+k+'\')">'+n+'</button>').join('');document.getElementById('app').innerHTML=({cliente:client,caixa:cash,banca:booth,gestao:admin}[page])();}function cash(){let total=Object.entries(cart).reduce((a,[id,q])=>a+p(+id).price*q,0);return '<h2>Caixa • Venda de fichas</h2><p class="muted">Selecione produtos de barracas diferentes e gere uma única ficha de compra.</p>'+db.stalls.map(b=>'<section class="card"><h3>'+esc(b.name)+'</h3>'+db.products.filter(x=>x.stall===b.id&&x.active&&b.open).map(x=>'<div class="line"><span>'+esc(x.name)+' <span class="muted">'+money(x.price)+' · estoque '+x.stock+'</span></span><input aria-label="Quantidade de '+esc(x.name)+'" type="number" min="0" max="'+x.stock+'" value="'+(cart[x.id]||0)+'" onchange="cart['+x.id+']=Math.max(0,Math.min('+x.stock+',+this.value||0));render()"></div>').join('')+'</section>').join('')+'<section class="card"><div class="line"><strong>Total: '+money(total)+'</strong><button class="primary" onclick="sell()" '+(!total?'disabled':'')+'>Emitir ficha única</button></div></section>'+ (db.tickets.length?'<section class="card"><h3>Última ficha emitida</h3><strong>'+db.tickets.at(-1).code+'</strong>'+qr(db.tickets.at(-1).code)+'<p class="muted">Informe esse código na carteira do cliente.</p></section>':'')}function sell(){let items=Object.entries(cart).filter(([id,q])=>q>0&&p(+id).active&&s(p(+id).stall).open&&p(+id).stock>=q).map(([id,q])=>({product:+id,qty:+q,used:0}));if(!items.length)return alert('Selecione produtos disponíveis.');let code='ARRAIA-'+db.next+++'-'+uid().slice(0,4);db.tickets.push({code,items,claimed:false,at:Date.now()});cart={};save();alert('Ficha emitida: '+code)}function client(){let wallet=db.tickets.filter(t=>t.claimed),mine=db.orders,ready=mine.filter(o=>o.status==='pronto'),waiting=mine.filter(o=>o.status==='pendente'||o.status==='preparando'),done=mine.filter(o=>o.status==='entregue');return '<div class="hero"><h2>🎟️ Minha festa, meus pedidos</h2><p>Seus créditos, filas e retiradas em um só lugar.</p><div class="bigstatus"><div><b>'+wallet.reduce((a,t)=>a+t.items.reduce((v,i)=>v+i.qty-i.used,0),0)+'</b><span>Créditos</span></div><div><b>'+waiting.length+'</b><span>Na cozinha</span></div><div><b>'+ready.length+'</b><span>Prontos!</span></div></div></div>'+(ready.length?'<div class="notice ready alert"><h2>🔔 Seu pedido está pronto!</h2><p>Dirija-se à barraca e apresente o QR de retirada.</p><button class="action" onclick="toggleMute()">'+(alarmMuted?'🔇 Ativar som':'🔊 Silenciar aviso')+'</button></div>':'')+'<div class="tiles"><button class="tile" onclick="document.getElementById(\'scanClaim\').scrollIntoView({behavior:\'smooth\'})"><span class="emoji">📷</span><strong>Ler ficha do caixa</strong><small>Escanear QR de compra</small></button><button class="tile" onclick="document.getElementById(\'walletSection\').scrollIntoView({behavior:\'smooth\'})"><span class="emoji">🎫</span><strong>Meus créditos</strong><small>Ativar quando quiser</small></button><button class="tile" onclick="document.getElementById(\'ordersSection\').scrollIntoView({behavior:\'smooth\'})"><span class="emoji">🍳</span><strong>Fila e preparo</strong><small>Ver posição e tempo</small></button><button class="tile" onclick="document.getElementById(\'ordersSection\').scrollIntoView({behavior:\'smooth\'})"><span class="emoji">🛎️</span><strong>Retiradas</strong><small>QR e confirmação</small></button></div><section class="card" id="scanClaim"><h2>📷 Ler QR do caixa</h2><div class="scanbox"><div style="font-size:48px">📸</div><button class="action primary" onclick="startScan(\'claim\')">Abrir câmera</button><p class="muted">Aponte para o QR da ficha comprada no caixa.</p><div id="cameraArea"></div></div><div class="row" style="margin-top:12px"><input id="claimcode" placeholder="Ou digite o código da ficha"><button onclick="claim()">Resgatar</button></div></section><section id="walletSection"><h2>🎫 Créditos disponíveis</h2>'+(wallet.length?wallet.map(t=>'<div class="card"><h3>Ficha '+esc(t.code)+'</h3>'+t.items.map(i=>{let x=p(i.product),n=i.qty-i.used;return '<div class="line"><div><strong>'+esc(x.name)+'</strong><div class="muted">'+esc(s(x.stall).name)+' · '+n+' crédito(s)</div></div><button class="action primary" onclick="activate(\''+t.code+'\','+x.id+')" '+(!n||!x.active||!s(x.stall).open||x.stock<1?'disabled':'')+'>🍳 Preparar 1</button></div>'}).join('')+'</div>').join(''):'<div class="card">Nenhuma ficha resgatada. Use a câmera acima ou compre uma ficha na aba Caixa.</div>')+'</section><section id="ordersSection"><h2>🍳 Acompanhar pedidos</h2>'+(mine.length?mine.slice().reverse().map(o=>{let x=p(o.product),b=s(x.stall),ahead=db.orders.filter(z=>z.stall===o.stall&&z.status!=='entregue'&&z.created<o.created).length,step=o.status==='pendente'?0:o.status==='preparando'?1:2;return '<div class="card '+(o.status==='pronto'?'alert':'')+'"><div class="line"><div><strong style="font-size:19px">'+esc(x.name)+'</strong><div class="muted">'+esc(b.name)+' · '+o.code+'</div></div><span class="pill">'+status[o.status]+'</span></div><div class="bigstatus"><div><b>'+(o.status==='pendente'?'🧾':o.status==='preparando'?'👩‍🍳':'🎉')+'</b><span>'+status[o.status]+'</span></div><div><b>'+(o.status==='pendente'||o.status==='preparando'?ahead+1:'✓')+'</b><span>Posição na fila</span></div><div><b>'+(o.status==='pendente'||o.status==='preparando'?(ahead+1)*b.avg+'m':'✓')+'</b><span>Tempo estimado</span></div></div><div class="progress"><span class="done"></span><span class="'+(step>=1?'done':'')+'"></span><span class="'+(step>=2?'done':'')+'"></span></div>'+(o.status==='pronto'||o.status==='chegou'?'<div class="notice ready"><h3>📱 Apresente este QR na barraca</h3>'+qr('RETIRADA:'+o.code)+'</div>':'')+(o.status==='chegou'?'<button class="action primary" onclick="deliver(\''+o.code+'\')">✅ Recebi meu produto</button>':'')+'</div>'}).join(''):'<div class="card">Você ainda não ativou nenhum pedido.</div>')+'</section>'}function claim(){let code=document.getElementById('claimcode').value.trim().toUpperCase(),t=db.tickets.find(x=>x.code===code);if(!t)return alert('Ficha não encontrada.');if(t.claimed)return alert('Ficha já resgatada.');t.claimed=true;save()}function activate(code,id){let t=db.tickets.find(x=>x.code===code),i=t?.items.find(x=>x.product===id),x=p(id);if(!t?.claimed||!i||i.used>=i.qty||!x.active||!s(x.stall).open||x.stock<1)return alert('Crédito ou produto indisponível.');i.used++;x.stock--;db.orders.push({code:'PED-'+uid(),product:id,stall:x.stall,status:'pendente',created:Date.now()});save()}function booth(){let b=s(stall),orders=db.orders.filter(o=>o.stall===stall&&o.status!=='entregue');return '<div class="hero"><h2>🍳 Painel das barracas</h2><p>Selecione sua barraca tocando no cartão.</p></div><div class="tiles">'+db.stalls.map(x=>'<button class="tile '+(stall===x.id?'selected':'')+'" onclick="stall='+x.id+';render()"><span class="emoji">'+(x.id===1?'🥟':x.id===2?'🥤':'🍰')+'</span><strong>'+esc(x.name)+'</strong><small>'+db.orders.filter(o=>o.stall===x.id&&o.status!=='entregue').length+' pedidos ativos</small></button>').join('')+'</div><div class="bigstatus"><div><b>'+orders.filter(o=>o.status==='pendente').length+'</b><span>Na fila</span></div><div><b>'+orders.filter(o=>o.status==='preparando').length+'</b><span>Preparando</span></div><div><b>'+orders.filter(o=>o.status==='pronto').length+'</b><span>Prontos</span></div></div><section class="card"><h2>📷 QR de retirada</h2><button class="action primary" onclick="startScan(\'pickup\')">📸 Ler QR do cliente</button><div id="cameraArea"></div><div class="row" style="margin-top:12px"><input id="pickup" placeholder="Ou digite PED-..."><button onclick="arrived()">Confirmar chegada</button></div></section><h2>📋 Fila da barraca</h2>'+(orders.length?orders.map((o,i)=>'<div class="card"><div class="line"><strong style="font-size:20px">'+esc(p(o.product).name)+'</strong><span class="tag">#'+(i+1)+'</span></div><h3>'+status[o.status]+'</h3><p class="muted">'+o.code+'</p>'+(o.status==='pendente'?'<button class="action" onclick="advance(\''+o.code+'\',\'preparando\')">👩‍🍳 Iniciar preparo</button>':o.status==='preparando'?'<button class="action primary" onclick="advance(\''+o.code+'\',\'pronto\')">✅ Pedido pronto</button>':'<span class="pill">Aguardando retirada</span>')+'</div>').join(''):'<div class="card">Nenhum pedido ativo nesta barraca.</div>')}function advance(code,state){let o=db.orders.find(x=>x.code===code);if(o)o.status=state;save()}function arrived(){let code=document.getElementById('pickup').value.trim().replace(/^RETIRADA:/i,'').toUpperCase(),o=db.orders.find(x=>x.code===code&&x.stall===stall);if(!o||o.status!=='pronto')return alert('Pedido não encontrado ou ainda não pronto.');o.status='chegou';save()}function deliver(code){let o=db.orders.find(x=>x.code===code);if(o?.status==='chegou')o.status='entregue';save()}function admin(){return '<h2>Gestão do evento</h2><section class="card"><div class="line"><span>Fichas emitidas: <b>'+db.tickets.length+'</b></span><span>Pedidos: <b>'+db.orders.length+'</b></span></div><p>Vendas registradas: <b>'+money(db.tickets.reduce((a,t)=>a+t.items.reduce((v,i)=>v+p(i.product).price*i.qty,0),0))+'</b></p></section>'+db.stalls.map(b=>'<section class="card"><div class="line"><h3>'+esc(b.name)+'</h3><button class="'+(b.open?'warn':'primary')+'" onclick="toggleStall('+b.id+')">'+(b.open?'Fechar':'Abrir')+'</button></div><label>Tempo médio (min) <input type="number" min="1" value="'+b.avg+'" onchange="setAvg('+b.id+',this.value)"></label>'+db.products.filter(x=>x.stall===b.id).map(x=>'<div class="line"><span>'+esc(x.name)+' <span class="tag">'+money(x.price)+'</span></span><div class="row"><input aria-label="Estoque" type="number" min="0" value="'+x.stock+'" onchange="setStock('+x.id+',this.value)"><button onclick="toggleProduct('+x.id+')">'+(x.active?'Desativar':'Ativar')+'</button></div></div>').join('')+'</section>').join('')+'<section class="card"><h3>Nova barraca</h3><div class="row"><input id="newstall" placeholder="Nome da barraca"><button onclick="addStall()">Adicionar</button></div><h3>Novo produto</h3><div class="row"><select id="ps">'+db.stalls.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select><input id="pn" placeholder="Produto"><input id="pp" type="number" min="0" step=".01" placeholder="Preço"><input id="pq" type="number" min="0" placeholder="Estoque"><button onclick="addProduct()">Adicionar</button></div></section><section class="card"><button class="warn" onclick="if(confirm(\'Apagar os dados da demonstração?\')){db=seed();cart={};save()}">Reiniciar demonstração</button></section>'}function toggleStall(id){s(id).open=!s(id).open;save()}function toggleProduct(id){p(id).active=!p(id).active;save()}function setStock(id,v){p(id).stock=Math.max(0,+v||0);save()}function setAvg(id,v){s(id).avg=Math.max(1,+v||1);save()}function addStall(){let name=document.getElementById('newstall').value.trim();if(!name)return;db.stalls.push({id:Math.max(0,...db.stalls.map(x=>x.id))+1,name,open:true,avg:5});save()}function addProduct(){let name=document.getElementById('pn').value.trim(),price=+document.getElementById('pp').value,stock=+document.getElementById('pq').value;if(!name||price<0||!Number.isFinite(price))return alert('Preencha o produto e preço.');db.products.push({id:Math.max(0,...db.products.map(x=>x.id))+1,stall:+document.getElementById('ps').value,name,price,stock:Math.max(0,stock||0),active:true});save()}
// Leitura de QR: câmera em navegadores compatíveis; fallback manual.
async function stopScan(){if(cameraTimer){clearInterval(cameraTimer);cameraTimer=null}if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}let a=document.getElementById('cameraArea');if(a)a.innerHTML=''}
async function startScan(mode){await stopScan();let area=document.getElementById('cameraArea');if(!area)return;if(!navigator.mediaDevices?.getUserMedia){area.innerHTML='<p>Este navegador não liberou a câmera. Digite o código manualmente.</p>';return}if(!('BarcodeDetector' in window)){area.innerHTML='<p>Seu navegador não oferece leitura automática de QR. Use o Chrome atualizado ou digite o código.</p>';return}try{let detector=new BarcodeDetector({formats:['qr_code']});cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});area.innerHTML='<video id="cameraVideo" autoplay playsinline muted></video><p class="muted">Posicione o QR dentro da imagem.</p><button onclick="stopScan()">Fechar câmera</button>';let video=document.getElementById('cameraVideo');video.srcObject=cameraStream;await video.play();let busy=false;cameraTimer=setInterval(async()=>{if(busy||!cameraStream)return;busy=true;try{let codes=await detector.detect(video);if(codes.length){let value=codes[0].rawValue.trim();await stopScan();if(mode==='claim'){let el=document.getElementById('claimcode');if(el){el.value=value;claim()}}else{let el=document.getElementById('pickup');if(el){el.value=value;arrived()}}}}catch(e){}finally{busy=false}},350)}catch(e){await stopScan();let a=document.getElementById('cameraArea');if(a)a.innerHTML='<p>Não foi possível acessar a câmera. Verifique a permissão no Chrome ou digite o código.</p>'}}
function toggleMute(){alarmMuted=!alarmMuted;localStorage.setItem('arraia-muted',alarmMuted?'1':'0');if(!alarmMuted)beep();render()}
let audioContext=null;function beep(){if(alarmMuted||document.hidden||!db.orders.some(o=>o.status==='pronto'))return;try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();let o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.setValueAtTime(740,audioContext.currentTime);o.frequency.setValueAtTime(940,audioContext.currentTime+.16);g.gain.setValueAtTime(.0001,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.09,audioContext.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+.43);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.45)}catch(e){}}
setInterval(()=>{if(page==='cliente')beep()},5000);
render();
</script></body></html>
